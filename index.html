<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>馬桶人防線大戰 - Skibidi Tower Defense</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #2b102b 100%);
            color: #f8fafc;
            min-height: 100vh;
            user-select: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            background: #0b0f19;
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.2);
            border-radius: 1rem;
            cursor: crosshair;
        }
        .tower-btn {
            transition: all 0.2s ease;
        }
        .tower-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }
        .tower-btn.active {
            border-color: #ec4899;
            background: rgba(236, 72, 153, 0.2);
        }
    </style>
</head>
<body class="p-4 md:p-6 flex flex-col items-center justify-center">

    <!-- Main Container -->
    <div class="w-full max-w-6xl mx-auto flex flex-col gap-6">

        <!-- Header -->
        <header class="glass-panel rounded-2xl p-4 md:p-5 flex flex-col md:flex-row items-center justify-between gap-4 shadow-2xl">
            <div class="flex items-center gap-3">
                <span class="text-3xl md:text-4xl">🚽</span>
                <div>
                    <h1 class="text-2xl md:text-3xl font-black bg-gradient-to-r from-pink-400 via-purple-400 to-cyan-400 bg-clip-text text-transparent">馬桶人防線大戰</h1>
                    <p class="text-xs text-slate-400">Skibidi Tower Defense - 部署監控人與音響人守護陣地</p>
                </div>
            </div>
            
            <!-- Game Stats Bar -->
            <div class="flex flex-wrap items-center justify-center gap-3 md:gap-5 bg-slate-900/80 px-5 py-2.5 rounded-xl border border-slate-700/80">
                <div class="text-center">
                    <span class="block text-[10px] text-slate-400 uppercase tracking-wider">金幣</span>
                    <span id="gold-display" class="text-lg font-black text-amber-400">$500</span>
                </div>
                <div class="h-7 w-px bg-slate-700"></div>
                <div class="text-center">
                    <span class="block text-[10px] text-slate-400 uppercase tracking-wider">基地生命</span>
                    <span id="lives-display" class="text-lg font-black text-rose-400">❤️ 20</span>
                </div>
                <div class="h-7 w-px bg-slate-700"></div>
                <div class="text-center">
                    <span class="block text-[10px] text-slate-400 uppercase tracking-wider">分數</span>
                    <span id="score-display" class="text-lg font-black text-emerald-400">0</span>
                </div>
                <div class="h-7 w-px bg-slate-700"></div>
                <div class="text-center">
                    <span class="block text-[10px] text-slate-400 uppercase tracking-wider">當前波次</span>
                    <span id="wave-display" class="text-lg font-black text-cyan-400">Wave 1 / 10</span>
                </div>
            </div>
        </header>

        <!-- Main Layout: Canvas + Control Sidebar -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <!-- Canvas Area (2 Cols on lg) -->
            <div class="lg:col-span-2 glass-panel rounded-3xl p-4 md:p-6 flex flex-col items-center shadow-2xl relative">
                <canvas id="gameCanvas" width="800" height="600" class="w-full max-w-[800px] h-auto aspect-[4/3]"></canvas>
            </div>

            <!-- Right Sidebar: Wave Control, Shop & Inspector -->
            <div class="flex flex-col gap-6">
                
                <!-- Wave Control Panel (Unobstructed in Sidebar) -->
                <div class="glass-panel rounded-3xl p-5 shadow-xl flex flex-col gap-3 border border-pink-500/30">
                    <h3 class="font-bold text-md text-slate-200 flex items-center gap-2">🚀 波次與戰鬥控制</h3>
                    <div id="wave-status-text" class="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-800 leading-relaxed">
                        Skibidi 馬桶大軍即將襲來，請佈署防禦塔！
                    </div>
                    <button id="start-wave-btn" onclick="startNextWave()" class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold text-sm shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                        <span>⚡</span> 開始 / 立即跳過至下一波
                    </button>
                </div>

                <!-- Tower Shop -->
                <div class="glass-panel rounded-3xl p-5 shadow-xl flex flex-col gap-4">
                    <h3 class="font-bold text-md text-slate-200 flex items-center gap-2">📷 陣營防禦塔商店</h3>
                    <p class="text-xs text-slate-400">選擇塔型後點擊地圖空地進行部署。</p>
                    
                    <div class="grid grid-cols-1 gap-3">
                        <!-- Camera Man -->
                        <button onclick="selectTowerType('cameraman')" id="shop-btn-cameraman" class="tower-btn active w-full text-left p-3 rounded-2xl bg-slate-800/80 border border-slate-700 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-cyan-500/20 border-2 border-cyan-400 flex items-center justify-center text-cyan-300 font-bold text-sm">監</div>
                                <div>
                                    <div class="text-sm font-bold text-slate-200">監控人 (Camera Man)</div>
                                    <div class="text-xs text-slate-400">標準光束 | 傷害均衡</div>
                                </div>
                            </div>
                            <span class="text-xs font-bold text-amber-400 bg-slate-900 px-2.5 py-1.5 rounded-xl border border-slate-700">$100</span>
                        </button>

                        <!-- Speaker Man -->
                        <button onclick="selectTowerType('speakerman')" id="shop-btn-speakerman" class="tower-btn w-full text-left p-3 rounded-2xl bg-slate-800/80 border border-slate-700 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-pink-500/20 border-2 border-pink-400 flex items-center justify-center text-pink-300 font-bold text-sm">音</div>
                                <div>
                                    <div class="text-sm font-bold text-slate-200">音響人 (Speaker Man)</div>
                                    <div class="text-xs text-slate-400">超高射速 | 音波連擊</div>
                                </div>
                            </div>
                            <span class="text-xs font-bold text-amber-400 bg-slate-900 px-2.5 py-1.5 rounded-xl border border-slate-700">$150</span>
                        </button>

                        <!-- TV Man -->
                        <button onclick="selectTowerType('tvman')" id="shop-btn-tvman" class="tower-btn w-full text-left p-3 rounded-2xl bg-slate-800/80 border border-slate-700 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-purple-500/20 border-2 border-purple-400 flex items-center justify-center text-purple-300 font-bold text-sm">電</div>
                                <div>
                                    <div class="text-sm font-bold text-slate-200">電視人 (TV Man)</div>
                                    <div class="text-xs text-slate-400">催眠減速 | 範圍控制</div>
                                </div>
                            </div>
                            <span class="text-xs font-bold text-amber-400 bg-slate-900 px-2.5 py-1.5 rounded-xl border border-slate-700">$130</span>
                        </button>
                    </div>
                </div>

                <!-- Tower Inspector / Upgrade Panel -->
                <div class="glass-panel rounded-3xl p-5 shadow-xl flex flex-col gap-3">
                    <h3 class="font-bold text-md text-slate-200 flex items-center gap-2">🔍 塔防屬性管理</h3>
                    <div id="inspector-content" class="text-xs text-slate-400 leading-relaxed bg-slate-900/60 p-4 rounded-2xl border border-slate-800 flex flex-col gap-2">
                        <p class="text-slate-400 italic">尚未選取任何防禦塔。點擊地圖上的防禦塔查看升級與售賣。</p>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Game Over / Victory Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div id="modal-content" class="glass-panel rounded-3xl p-8 max-w-md w-full text-center flex flex-col items-center gap-4 shadow-2xl border border-pink-500/30">
            <div id="modal-icon" class="text-6xl mb-2">🏆</div>
            <h2 id="modal-title" class="text-2xl font-black text-white">勝利！馬桶人被擊退</h2>
            <p id="modal-desc" class="text-slate-300 text-sm leading-relaxed">你成功抵禦了所有馬桶人軍團的入侵，保衛了聯盟總部！</p>
            <div id="modal-stats" class="w-full bg-slate-900/60 p-4 rounded-xl text-left text-xs text-slate-300 flex flex-col gap-1.5 my-2">
                <div>最終得分：<span id="end-score" class="font-bold text-emerald-400">0</span></div>
                <div>剩餘生命：<span id="end-lives" class="font-bold text-rose-400">20</span></div>
            </div>
            <button onclick="restartGame()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold shadow-lg transition transform active:scale-95">
                重新開始防線
            </button>
        </div>
    </div>

    <!-- JavaScript Game Engine -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Configuration & State
        let gold = 500;
        let lives = 20;
        let score = 0;
        let currentWave = 1;
        let maxWaves = 10;
        let waveActive = false;
        let selectedTowerType = 'cameraman'; // 'cameraman', 'speakerman', 'tvman'
        let selectedTower = null;

        // Path waypoints across 800x600 canvas
        const pathWaypoints = [
            { x: 0, y: 100 },
            { x: 150, y: 100 },
            { x: 150, y: 460 },
            { x: 350, y: 460 },
            { x: 350, y: 140 },
            { x: 580, y: 140 },
            { x: 580, y: 480 },
            { x: 800, y: 480 }
        ];

        // Tower Definitions
        const towerDefs = {
            cameraman: { name: "監控人", cost: 100, range: 130, damage: 25, fireRate: 35, color: "#06b6d4" },
            speakerman: { name: "音響人", cost: 150, range: 95, damage: 12, fireRate: 12, color: "#ec4899" },
            tvman:      { name: "電視人", cost: 130, range: 110, damage: 8, fireRate: 50, color: "#a855f7" }
        };

        let towers = [];
        let enemies = [];
        let bullets = [];
        let particles = [];
        let spawnQueue = [];
        let spawnTimer = 0;

        // Generate Skibidi Toilet Wave enemies
        function generateWaveEnemies(wave) {
            let list = [];
            let count = 6 + wave * 3;
            let hpMultiplier = 1 + (wave - 1) * 0.4;

            for (let i = 0; i < count; i++) {
                let type = 'normal';
                if (wave >= 3 && i % 4 === 0) type = 'fast';
                if (wave >= 5 && i % 5 === 0) type = 'boss';

                list.push({
                    type: type,
                    hp: type === 'boss' ? 200 * hpMultiplier : type === 'fast' ? 45 * hpMultiplier : 80 * hpMultiplier,
                    maxHp: type === 'boss' ? 200 * hpMultiplier : type === 'fast' ? 45 * hpMultiplier : 80 * hpMultiplier,
                    speed: type === 'fast' ? 2.6 : type === 'boss' ? 1.1 : 1.6,
                    reward: type === 'boss' ? 30 : type === 'fast' ? 15 : 10,
                    scoreVal: type === 'boss' ? 150 : type === 'fast' ? 70 : 50,
                    radius: type === 'boss' ? 16 : 11,
                    color: type === 'boss' ? '#f59e0b' : type === 'fast' ? '#38bdf8' : '#cbd5e1'
                });
            }
            return list;
        }

        // Start Next Wave or Skip Delay
        function startNextWave() {
            if (waveActive) {
                // If wave is active, clicking this button can instantly spawn remaining enemies (Skip wait)
                if (spawnQueue.length > 0) {
                    while(spawnQueue.length > 0) {
                        enemies.push(new Enemy(spawnQueue.shift()));
                    }
                    showFloatingText("已立即加速召喚剩餘敵軍！", canvas.width / 2, canvas.height / 2, "#38bdf8");
                }
                return;
            }
            if (currentWave > maxWaves) return;

            waveActive = true;
            spawnQueue = generateWaveEnemies(currentWave);
            document.getElementById('wave-status-text').innerText = `Wave ${currentWave}：Skibidi 馬桶大軍猛烈進攻中！`;
        }

        // Select Tower Type
        function selectTowerType(type) {
            selectedTowerType = type;
            selectedTower = null;
            document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`shop-btn-${type}`).classList.add('active');
            updateInspector();
        }

        // Check if point is too close to path
        function isNearPath(x, y) {
            const minDistSq = 38 * 38;
            for (let i = 0; i < pathWaypoints.length - 1; i++) {
                let p1 = pathWaypoints[i];
                let p2 = pathWaypoints[i+1];
                let distSq = distToSegmentSquared({x, y}, p1, p2);
                if (distSq < minDistSq) return true;
            }
            return false;
        }

        function distToSegmentSquared(p, p1, p2) {
            let l2 = (p2.x - p1.x)*(p2.x - p1.x) + (p2.y - p1.y)*(p2.y - p1.y);
            if (l2 === 0) return (p.x - p1.x)*(p.x - p1.x) + (p.y - p1.y)*(p.y - p1.y);
            let t = ((p.x - p1.x)*(p2.x - p1.x) + (p.y - p1.y)*(p2.y - p1.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return (p.x - (p1.x + t * (p2.x - p1.x))) * (p.x - (p1.x + t * (p2.x - p1.x))) +
                   (p.y - (p1.y + t * (p2.y - p1.y))) * (p.y - (p1.y + t * (p2.y - p1.y)));
        }

        // Canvas Click Handler for Building / Selecting
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            // Check if clicking existing tower
            for (let t of towers) {
                let dx = t.x - mouseX;
                let dy = t.y - mouseY;
                if (dx*dx + dy*dy < 22*22) {
                    selectedTower = t;
                    updateInspector();
                    return;
                }
            }

            // Build new tower
            let def = towerDefs[selectedTowerType];
            if (gold < def.cost) {
                showFloatingText("金幣不足！", mouseX, mouseY, "#f43f5e");
                return;
            }
            if (isNearPath(mouseX, mouseY)) {
                showFloatingText("不能建造在行軍路徑上！", mouseX, mouseY, "#f43f5e");
                return;
            }
            for (let t of towers) {
                let dx = t.x - mouseX;
                let dy = t.y - mouseY;
                if (dx*dx + dy*dy < 38*38) {
                    showFloatingText("位置過於擁擠！", mouseX, mouseY, "#f43f5e");
                    return;
                }
            }

            gold -= def.cost;
            towers.push({
                x: mouseX,
                y: mouseY,
                type: selectedTowerType,
                level: 1,
                range: def.range,
                damage: def.damage,
                fireRate: def.fireRate,
                cooldown: 0,
                angle: 0,
                target: null,
                color: def.color
            });

            updateUI();
            updateInspector();
        });

        function showFloatingText(text, x, y, color) {
            particles.push({ x: x, y: y, text: text, color: color, life: 40, vy: -1.5 });
        }

        // Skibidi Toilet Enemy Class
        class Enemy {
            constructor(data) {
                this.type = data.type;
                this.hp = data.hp;
                this.maxHp = data.maxHp;
                this.speed = data.speed;
                this.reward = data.reward;
                this.scoreVal = data.scoreVal;
                this.radius = data.radius;
                this.color = data.color;
                this.pathIndex = 0;
                this.x = pathWaypoints[0].x;
                this.y = pathWaypoints[0].y;
                this.slowTimer = 0;
            }

            update() {
                let currentSpeed = this.speed;
                if (this.slowTimer > 0) {
                    currentSpeed *= 0.5;
                    this.slowTimer--;
                }

                let targetPoint = pathWaypoints[this.pathIndex + 1];
                if (!targetPoint) return;

                let dx = targetPoint.x - this.x;
                let dy = targetPoint.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < currentSpeed) {
                    this.x = targetPoint.x;
                    this.y = targetPoint.y;
                    this.pathIndex++;
                    if (this.pathIndex >= pathWaypoints.length - 1) {
                        lives--;
                        updateUI();
                        this.hp = 0;
                        if (lives <= 0) triggerGameOver(false);
                    }
                } else {
                    this.x += (dx / dist) * currentSpeed;
                    this.y += (dy / dist) * currentSpeed;
                }
            }

            draw() {
                // Draw Skibidi Toilet Bowl
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Draw Head / Face inside toilet
                ctx.fillStyle = '#fca5a5';
                ctx.beginPath();
                ctx.arc(this.x, this.y - 2, this.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();

                // Sunglasses / Skibidi Expression
                ctx.fillStyle = '#000000';
                ctx.fillRect(this.x - 5, this.y - 5, 10, 4);

                if (this.slowTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
                    ctx.strokeStyle = '#a855f7';
                    ctx.stroke();
                }

                // HP Bar
                let barW = 26;
                let barH = 4;
                let ratio = Math.max(0, this.hp / this.maxHp);
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(this.x - barW/2, this.y - this.radius - 12, barW, barH);
                ctx.fillStyle = this.hp > this.maxHp * 0.5 ? '#10b981' : '#f59e0b';
                ctx.fillRect(this.x - barW/2, this.y - this.radius - 12, barW * ratio, barH);
            }
        }

        // Bullet Class
        class Bullet {
            constructor(x, y, targetEnemy, damage, type) {
                this.x = x;
                this.y = y;
                this.target = targetEnemy;
                this.damage = damage;
                this.type = type;
                this.speed = 9;
                this.active = true;
            }

            update() {
                if (!this.target || this.target.hp <= 0) {
                    this.active = false;
                    return;
                }
                let dx = this.target.x - this.x;
                let dy = this.target.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.target.hp -= this.damage;
                    if (this.type === 'tvman') {
                        this.target.slowTimer = 90; // 1.5s slow
                    }
                    if (this.target.hp <= 0) {
                        gold += this.target.reward;
                        score += this.target.scoreVal;
                        updateUI();
                    }
                    this.active = false;
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.type === 'tvman' ? 5 : 3.5, 0, Math.PI * 2);
                ctx.fillStyle = this.type === 'tvman' ? '#c084fc' : this.type === 'speakerman' ? '#f472b6' : '#22d3ee';
                ctx.fill();
            }
        }

        // Game Loop Update
        function update() {
            if (waveActive && spawnQueue.length > 0) {
                spawnTimer++;
                if (spawnTimer >= 35) {
                    enemies.push(new Enemy(spawnQueue.shift()));
                    spawnTimer = 0;
                }
            } else if (waveActive && spawnQueue.length === 0 && enemies.length === 0) {
                waveActive = false;
                currentWave++;
                if (currentWave > maxWaves) {
                    triggerGameOver(true);
                } else {
                    document.getElementById('start-wave-btn').disabled = false;
                    document.getElementById('start-wave-btn').classList.remove('opacity-50', 'cursor-not-allowed');
                    document.getElementById('wave-status-text').innerText = `Wave ${currentWave - 1} 完成！準備迎接下一波`;
                    document.getElementById('wave-display').innerText = `Wave ${currentWave} / ${maxWaves}`;
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update();
                if (enemies[i].hp <= 0) enemies.splice(i, 1);
            }

            for (let tower of towers) {
                if (tower.cooldown > 0) tower.cooldown--;

                let closestEnemy = null;
                let minDist = tower.range;
                for (let enemy of enemies) {
                    let dist = Math.hypot(enemy.x - tower.x, enemy.y - tower.y);
                    if (dist <= minDist) {
                        minDist = dist;
                        closestEnemy = enemy;
                    }
                }

                tower.target = closestEnemy;
                if (tower.target) {
                    tower.angle = Math.atan2(tower.target.y - tower.y, tower.target.x - tower.x);
                    if (tower.cooldown === 0) {
                        bullets.push(new Bullet(tower.x, tower.y, tower.target, tower.damage, tower.type));
                        tower.cooldown = tower.fireRate;
                    }
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                if (!bullets[i].active) bullets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].y += particles[i].vy;
                particles[i].life--;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid background
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Path
            ctx.beginPath();
            ctx.moveTo(pathWaypoints[0].x, pathWaypoints[0].y);
            for (let i = 1; i < pathWaypoints.length; i++) {
                ctx.lineTo(pathWaypoints[i].x, pathWaypoints[i].y);
            }
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 38;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 8;
            ctx.stroke();

            // HQ Base Icon
            let lastP = pathWaypoints[pathWaypoints.length - 1];
            ctx.fillStyle = '#ec4899';
            ctx.beginPath();
            ctx.arc(lastP.x, lastP.y, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("總部", lastP.x, lastP.y);

            // Towers (Circular base with rotating camera/speaker barrel)
            for (let t of towers) {
                if (selectedTower === t) {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(6, 182, 212, 0.08)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                // Rotating Barrel / Camera Lens
                ctx.save();
                ctx.translate(t.x, t.y);
                ctx.rotate(t.angle);
                ctx.fillStyle = '#64748b';
                ctx.fillRect(0, -6, 26, 12);
                ctx.restore();

                // Circular Base
                ctx.beginPath();
                ctx.arc(t.x, t.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = '#1e293b';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = t.color;
                ctx.stroke();

                // Inner core
                ctx.beginPath();
                ctx.arc(t.x, t.y, 7, 0, Math.PI * 2);
                ctx.fillStyle = t.color;
                ctx.fill();

                if (t.level > 1) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`L${t.level}`, t.x, t.y - 22);
                }
            }

            for (let e of enemies) e.draw();
            for (let b of bullets) b.draw();

            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.life / 40;
                ctx.fillStyle = p.color;
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.text, p.x, p.y);
                ctx.restore();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            document.getElementById('gold-display').innerText = `$${gold}`;
            document.getElementById('lives-display').innerText = `❤️ ${lives}`;
            document.getElementById('score-display').innerText = score;
        }

        function updateInspector() {
            const container = document.getElementById('inspector-content');
            if (!selectedTower) {
                container.innerHTML = `<p class="text-slate-400 italic">尚未選取任何防禦塔。點擊地圖上的防禦塔查看升級與售賣。</p>`;
                return;
            }

            let def = towerDefs[selectedTower.type];
            let upgradeCost = Math.round(def.cost * 0.8 * selectedTower.level);
            let refundValue = Math.round(def.cost * 0.6 * selectedTower.level);

            container.innerHTML = `
                <div class="flex justify-between items-center font-bold text-slate-200">
                    <span>${def.name} (Lv.${selectedTower.level})</span>
                    <span class="text-cyan-400">傷害: ${selectedTower.damage}</span>
                </div>
                <div class="text-slate-400">射程: ${selectedTower.range} | 攻速: ${selectedTower.fireRate}f</div>
                <div class="flex gap-2 mt-2">
                    <button onclick="upgradeSelectedTower()" class="flex-1 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs shadow transition">
                        升級 ($${upgradeCost})
                    </button>
                    <button onclick="sellSelectedTower()" class="py-2 px-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow transition">
                        出售 (+$${refundValue})
                    </button>
                </div>
            `;
        }

        function upgradeSelectedTower() {
            if (!selectedTower) return;
            let def = towerDefs[selectedTower.type];
            let cost = Math.round(def.cost * 0.8 * selectedTower.level);
            if (gold < cost) {
                showFloatingText("金幣不足升級！", selectedTower.x, selectedTower.y, "#f43f5e");
                return;
            }

            gold -= cost;
            selectedTower.level++;
            selectedTower.damage = Math.round(selectedTower.damage * 1.35);
            selectedTower.range += 12;
            updateUI();
            updateInspector();
        }

        function sellSelectedTower() {
            if (!selectedTower) return;
            let def = towerDefs[selectedTower.type];
            let refund = Math.round(def.cost * 0.6 * selectedTower.level);
            gold += refund;

            let idx = towers.indexOf(selectedTower);
            if (idx > -1) towers.splice(idx, 1);

            selectedTower = null;
            updateUI();
            updateInspector();
        }

        function triggerGameOver(isVictory) {
            const overlay = document.getElementById('modal-overlay');
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');

            if (isVictory) {
                icon.innerText = "🏆";
                title.innerText = "勝利！成功消滅馬桶軍團";
                desc.innerText = "你率領監控人與音響人聯盟成功抵禦所有 10 波 Skibidi 攻擊！";
            } else {
                icon.innerText = "💀";
                title.innerText = "防線崩潰";
                desc.innerText = "馬桶人突破了總部防線！";
            }

            document.getElementById('end-score').innerText = score;
            document.getElementById('end-lives').innerText = lives;

            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function restartGame() {
            gold = 500;
            lives = 20;
            score = 0;
            currentWave = 1;
            waveActive = false;
            towers = [];
            enemies = [];
            bullets = [];
            particles = [];
            spawnQueue = [];
            selectedTower = null;

            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-overlay').classList.remove('flex');
            document.getElementById('wave-status-text').innerText = "Skibidi 馬桶大軍即將襲來，請部署防禦塔！";
            document.getElementById('wave-display').innerText = `Wave 1 / ${maxWaves}`;

            updateUI();
            updateInspector();
        }

        window.onload = function() {
            updateUI();
            gameLoop();
        };
    </script>
</body>
</html>
