<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120a1a">
<title>Moto Brawl</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
/* THEME: 90s arcade after dark: asphalt black, hot orange, volt yellow, skewed chunky panels */
:root{--bg:#120a1a;--ink:#fff4e0;--muted:#a99cb8;--hot:#ff4f1f;--volt:#ffe14d;--cyan:#36e2ff;--red:#ff2d55;--green:#3ddc84}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;position:relative;background:var(--bg);color:var(--ink);font-family:"Bungee","Impact","Arial Black",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.35;cursor:default}
small,.how,.card p{font-family:"Trebuchet MS",sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:1px}

/* the road fills the screen; the canvas is low-res on purpose and scaled up with hard pixels */
.stage{position:absolute;inset:0;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:pointer}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* HUD: title, pills and pause, then the dash (health, nos, bike, speed, the rider you are fighting) */
.hud{position:absolute;left:0;right:0;top:0;z-index:3;pointer-events:none;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px)}
/* a soft shade under the HUD keeps it readable over bright windows and snow */
.hud::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(100% + 28px);z-index:-1;background:linear-gradient(rgba(10,6,16,.6),rgba(10,6,16,0))}
.hud .row{display:flex;align-items:center;gap:8px;min-height:44px}
.hud button{pointer-events:auto}
.title{flex:1;min-width:0;font-size:clamp(16px,2vmin + 9px,26px);line-height:1;color:var(--volt);text-shadow:2px 2px 0 var(--hot),4px 4px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{flex:none;display:inline-flex;flex-direction:column;align-items:center;min-width:52px;padding:2px 9px;background:#000;border:2px solid var(--hot);transform:skew(-10deg);font-variant-numeric:tabular-nums}
.stat small{font-size:9px;color:var(--muted);line-height:1.3}
.stat b{font-size:17px;font-weight:400;line-height:1.1}
.pause{flex:none;width:44px;height:44px;display:grid;place-items:center;background:#000;border:2px solid var(--volt);transform:skew(-8deg);box-shadow:3px 3px 0 var(--hot)}
.pause i{display:block;width:14px;height:16px;border-left:5px solid var(--volt);border-right:5px solid var(--volt)}
html[data-game-state="paused"] .pause i{width:0;height:0;border:0;border-left:15px solid var(--volt);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
html[data-game-state="attract"] .hud,html[data-game-state="ready"] .hud{visibility:hidden}
.dash{display:flex;align-items:flex-start;gap:12px;margin-top:6px}
.bars{display:grid;gap:3px}
.bl{display:flex;align-items:center;gap:5px}
.bl small{width:30px;font-size:9px;color:var(--muted);text-align:right;text-shadow:1px 1px 0 #000}
.bar{display:block;width:clamp(70px,20vw,150px);height:9px;background:#000c;border:1px solid #fff4;transform:skew(-14deg);overflow:hidden}
.bar b{display:block;height:100%;transform-origin:left;background:var(--green);transition:transform .15s}
.bar.nos b{background:var(--cyan)}.bar.dmg b{background:var(--volt)}.foe .bar b{background:var(--red)}
.spd{line-height:1;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 #000}
.spd b{font-size:clamp(22px,3vmin + 12px,36px);font-weight:400}
.spd small{display:block;font-size:10px;color:var(--volt)}
.spd em{display:block;font-style:normal;font-size:11px;color:var(--hot);margin-top:2px}
.foe{margin-left:auto;text-align:right;opacity:0;transition:opacity .2s}
.foe.on{opacity:1}
.foe span{display:block;font-size:12px;margin-bottom:3px;text-shadow:2px 2px 0 #000}
@media (max-width:420px){.hud .row{gap:6px}.stat{min-width:0;padding:2px 7px}.stat b{font-size:15px}.title{font-size:15px}}
@media (max-height:430px){.dash{margin-top:2px}.bar{height:7px}.bars{gap:2px}.spd b{font-size:22px}}

/* live start screen over the running demo race */
.attract{position:absolute;left:0;right:0;top:var(--copy-top,10vh);z-index:2;display:none;flex-direction:column;align-items:center;gap:8px;padding:0 20px;text-align:center;pointer-events:none}
html[data-game-state="attract"] .attract{display:flex}
.attract::before{content:"";position:absolute;left:0;right:0;top:-25%;bottom:-25%;z-index:-1;background:radial-gradient(closest-side,rgba(18,10,26,.6),rgba(18,10,26,0))}
.attract h1{font-size:clamp(42px,10vmin,96px);line-height:.88;font-weight:400;color:var(--volt);transform:rotate(-4deg) skew(-8deg);text-shadow:3px 3px 0 var(--hot),6px 6px 0 #000}
.attract .cta{margin-top:10px;font-size:clamp(17px,2vmin + 10px,28px);background:var(--hot);color:#fff;padding:6px 18px;border:3px solid #000;box-shadow:5px 5px 0 #000;transform:skew(-10deg);animation:pulse 1.1s ease-in-out infinite}
.attract .how{max-width:30em;font-size:clamp(12px,1vmin + 10px,16px);text-shadow:0 2px 0 #000,0 0 10px #000}
.attract .next{padding:4px 14px;background:#000;border:2px solid var(--volt);font-size:13px;transform:skew(-10deg)}
.attract .gbtn{pointer-events:auto;min-height:44px;padding:6px 20px;background:#000;border:3px solid var(--volt);color:var(--volt);font-size:16px;transform:skew(-10deg);box-shadow:4px 4px 0 var(--hot)}

/* big call-outs (countdown, knockouts) and small toasts */
.banner{position:absolute;left:0;right:0;top:32%;z-index:5;text-align:center;pointer-events:none;font-size:clamp(36px,10vmin,96px);color:var(--volt);text-shadow:3px 3px 0 var(--hot),6px 6px 0 #000;opacity:0}
.banner.show{animation:pop .95s ease-out both}
.banner.bad{color:var(--red)}
.toast{position:absolute;left:50%;top:var(--toast-top,30%);z-index:5;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;background:#000;border:2px solid var(--cyan);color:var(--cyan);padding:4px 14px;font-size:14px;transform:translateX(-50%) skew(-10deg)}
.toast.show{opacity:1}

/* pause, results and the garage */
.layer{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(18,10,26,.6);
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}
html[data-game-state="paused"] #paused,html[data-game-state="over"] #over,html[data-game-state="ready"] #garage{display:flex}
.card{width:min(360px,100%);max-height:100%;overflow:auto;scrollbar-width:none;text-align:center;background:#000;border:3px solid var(--volt);padding:20px;box-shadow:8px 8px 0 var(--hot);animation:rise .3s cubic-bezier(.2,1.4,.4,1)}
.card::-webkit-scrollbar{display:none}
.card h2{font-size:30px;font-weight:400;line-height:1;color:var(--volt);text-shadow:3px 3px 0 var(--hot)}
.card .route{margin-top:6px;color:var(--muted);font-size:12px}
.rows{display:flex;gap:8px;margin:14px 0 8px}
.rows div{flex:1;border:2px solid #333;padding:6px 4px;transform:skew(-8deg)}
.rows small{display:block;font-size:10px;color:var(--muted)}
.rows b{font-size:22px;font-weight:400}
.card p{font-size:13px;color:var(--cyan);min-height:1.3em}
.btn,.btn2{display:block;width:100%;min-height:50px;margin-top:10px;font-size:17px;border:3px solid #000;transform:skew(-8deg)}
.btn{background:var(--hot);color:#fff;box-shadow:5px 5px 0 var(--volt)}
.btn2{background:#1d1626;border-color:#3a3048;min-height:44px;font-size:14px}
.btn:active{transform:skew(-8deg) translate(3px,3px);box-shadow:2px 2px 0 var(--volt)}
.two{display:flex;gap:10px}.two>*{flex:1}
.card .sub{margin-top:10px;color:var(--muted);font-size:11px;min-height:0}
.wide{width:min(760px,100%);text-align:left}
.ghead{display:flex;align-items:center;gap:10px}
.ghead h2{flex:1}
.cash{color:var(--green);font-weight:400;font-size:20px}
.x{position:relative;flex:none;width:44px;height:44px;border:2px solid #3a3048;font-size:18px}
.snd.off{color:var(--muted)}
.snd.off::after{content:"";position:absolute;left:9px;right:9px;top:50%;height:2px;background:currentColor;transform:rotate(-45deg)}
.tabs{display:flex;gap:6px;margin-top:12px}
.tabs button{flex:1;min-height:40px;border:2px solid #3a3048;font-size:12px;transform:skew(-8deg)}
.tabs .on{border-color:var(--volt);color:var(--volt)}
.wide h3{margin:14px 0 6px;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:1px}
.list{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding:2px 8px 8px 2px}
.list::-webkit-scrollbar{display:none}
.rc,.bc{flex:none;width:148px;padding:10px;border:3px solid #3a3048;text-align:left;background:#15101c}
.rc{min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;text-shadow:2px 2px 0 #000}
.rc.on,.bc.on{border-color:var(--volt);box-shadow:4px 4px 0 var(--hot)}
.rc b,.bc b{display:block;font-size:13px;font-weight:400;line-height:1.1}
.rc small,.bc small{display:block;font-size:10px;opacity:.85;margin-top:4px}
.bc img{display:block;width:120px;height:64px;image-rendering:pixelated;margin:0 auto 6px}
.st{display:grid;grid-template-columns:38px 1fr;gap:3px 6px;align-items:center;margin-top:6px}
.st small{margin:0!important;font-size:8px}
.st i{height:5px;background:#333}.st i b{display:block;height:100%;background:var(--cyan)}
/* the Race button stays in reach however far the garage scrolls */
.gfoot{position:sticky;bottom:-20px;margin:4px -20px -20px;padding:8px 20px 20px;background:linear-gradient(#0000,#000 12px)}
.gfoot .btn{margin:0}
/* phones on their side: one compact screen, bikes drawn beside their stats */
@media (max-height:500px){
  .layer{padding-top:calc(env(safe-area-inset-top) + 6px);padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
  .wide{padding:10px 16px}
  .wide h3{display:none}
  .ghead h2{font-size:24px}
  .tabs{margin:6px 0 8px}.tabs button{min-height:36px}
  .list{padding-bottom:6px}
  .rc{width:128px;min-height:62px;padding:6px 8px}
  .bc{width:236px;padding:6px 8px;display:grid;grid-template-columns:96px 1fr;column-gap:8px;align-items:center}
  .bc img{grid-row:1/4;width:96px;height:52px;margin:0}
  .bc .st{margin-top:2px}
  .gfoot{bottom:-10px;margin:0 -16px -10px;padding:6px 16px 10px}
  .gfoot .btn{min-height:44px}
}

/* thumb pads: only on touch screens. Steering on the left thumb, the fight on the right */
.controls{display:none}
@media (pointer: coarse){
  .controls{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
    padding:10px calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px)}
  .controls .grp{display:flex;gap:10px;pointer-events:auto}
  .controls .acts{display:grid;grid-template-columns:auto auto;gap:10px;align-items:end;justify-items:end}
  .controls button{width:64px;height:64px;display:grid;place-items:center;font-size:14px;touch-action:none;background:rgba(0,0,0,.62);border:3px solid var(--volt);color:var(--volt);
    transform:skew(-8deg);box-shadow:4px 4px 0 var(--hot)}
  .controls .steer button{width:72px;height:72px;font-size:24px}
  /* drawn arrows: iOS turns the ◀ ▶ characters into blue emoji keys */
  .tri{display:block;width:0;height:0;border-top:.45em solid transparent;border-bottom:.45em solid transparent}
  .tri.l{border-right:.7em solid currentColor;margin-right:.1em}.tri.r{border-left:.7em solid currentColor;margin-left:.1em}
  .controls .sm{width:50px;height:50px;font-size:11px;border-color:var(--cyan);color:var(--cyan)}
  .controls button.on{background:var(--volt);color:#000;transform:skew(-8deg) translate(2px,2px);box-shadow:2px 2px 0 var(--hot)}
  html[data-game-state="ready"] .controls,html[data-game-state="over"] .controls{visibility:hidden}
}
@media (pointer: coarse) and (min-width: 700px){
  .controls{padding-left:calc(env(safe-area-inset-left) + 30px);padding-right:calc(env(safe-area-inset-right) + 30px);padding-bottom:calc(env(safe-area-inset-bottom) + 26px)}
  .controls .grp,.controls .acts{gap:14px}
  .controls button{width:78px;height:78px;font-size:16px}
  .controls .steer button{width:88px;height:88px;font-size:30px}
  .controls .sm{width:60px;height:60px}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.75}}
@keyframes rise{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{opacity:0;transform:skew(-10deg) scale(2)}15%,75%{opacity:1;transform:skew(-10deg) scale(1)}100%{opacity:0;transform:skew(-10deg) scale(.92)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="c" data-game-field></canvas></div>
<header class="hud" id="hud" data-game-hud>
  <div class="row">
    <div class="title">Moto Brawl</div>
    <span class="stat"><small>Pos</small><b id="pos">8/8</b></span>
    <span class="stat"><small>KOs</small><b id="kos">0</b></span>
    <button class="pause" id="pauseBtn" aria-label="Pause"><i></i></button>
  </div>
  <div class="dash">
    <div class="bars">
      <div class="bl"><small>HP</small><i class="bar"><b id="bHp"></b></i></div>
      <div class="bl"><small>Nos</small><i class="bar nos"><b id="bNos"></b></i></div>
      <div class="bl"><small>Bike</small><i class="bar dmg"><b id="bBike"></b></i></div>
    </div>
    <div class="spd"><b id="spd">0</b><small>km/h</small><em id="wpn"></em></div>
    <div class="foe" id="foe"><span id="foeName"></span><i class="bar"><b id="bFoe"></b></i></div>
  </div>
</header>
<div class="attract" id="copy" aria-live="polite">
  <h1>Moto<br>Brawl</h1>
  <p class="cta" id="cta">Tap to race</p>
  <p class="how" id="how"></p>
  <p class="next" id="next"></p>
  <button class="gbtn" id="garageBtn">Garage</button>
</div>
<div class="banner" id="banner"></div>
<div class="toast" id="toast"></div>
<div class="controls" id="controls" data-game-controls>
  <div class="grp steer"><button data-key="left" aria-label="Steer left"><i class="tri l"></i></button><button data-key="right" aria-label="Steer right"><i class="tri r"></i></button></div>
  <div class="grp acts"><button class="sm" data-key="brake">Brake</button><button class="sm" data-key="boost">Nos</button><button data-key="kick">Kick</button><button data-key="hit">Hit</button></div>
</div>
<div class="layer" id="paused"><div class="card">
  <h2>Paused</h2>
  <button class="btn" id="resume">Resume</button>
  <div class="two"><button class="btn2" id="restart">Restart</button><button class="btn2" id="quit">Garage</button></div>
  <button class="btn2" id="sndP">Sound on</button>
</div></div>
<div class="layer" id="over"><div class="card">
  <h2 id="ovTitle">1st</h2>
  <p class="route" id="ovRoute"></p>
  <div class="rows"><div><small>Place</small><b id="ovPlace">-</b></div><div><small>KOs</small><b id="ovKos">0</b></div><div><small>Cash</small><b id="ovCash">$0</b></div></div>
  <p id="ovText"></p>
  <button class="btn" id="ovNext">Next race</button>
  <button class="btn2" id="ovGarage">Garage</button>
  <p class="sub" id="ovSub">or tap anywhere</p>
</div></div>
<div class="layer" id="garage"><div class="card wide">
  <div class="ghead"><h2>Garage</h2><b class="cash" id="gCash">$0</b><button class="x snd" id="sndG" aria-label="Sound on">♪</button><button class="x" id="gClose" aria-label="Close">✕</button></div>
  <div class="tabs" id="gLeague"></div>
  <h3>Route</h3><div class="list" id="gRoutes"></div>
  <h3>Bike</h3><div class="list" id="gBikes"></div>
  <div class="gfoot"><button class="btn" id="gRace">Race</button></div>
</div></div>
<div id="safe"></div>
<script>
'use strict';
/* ==========================================================
   Shared helpers (G): storage, keys + touch pads, loop
   ========================================================== */
const G = (() => {
  const mem = {};
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  // localStorage with in-memory fallback (works in sandboxed previews too)
  const store = {
    get(k, d){ try { const v = localStorage.getItem('gp:' + k); if (v != null) return JSON.parse(v); } catch (e) {} return k in mem ? mem[k] : d; },
    set(k, v){ mem[k] = v; try { localStorage.setItem('gp:' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const setText = (id, v) => { const e = document.getElementById(id); if (e && e.textContent !== String(v)) e.textContent = v; };
  // keyboard and the on-screen pads share key names (Space and Enter belong to the shell)
  const keys = {};
  const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowDown:'brake', KeyS:'brake',
    ArrowUp:'boost', KeyW:'boost', ShiftLeft:'boost', ShiftRight:'boost', KeyJ:'hit', KeyZ:'hit', KeyK:'kick', KeyX:'kick' };
  const keyFns = [];
  const onKey = fn => keyFns.push(fn);
  function press(k, down){ if (!!keys[k] === down) return; keys[k] = down; keyFns.forEach(f => f(k, down)); }
  window.addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); press(k, true); });
  window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) press(k, false); });
  $$('[data-key]').forEach(el => {
    const k = el.dataset.key;
    el.addEventListener('pointerdown', e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (x) {} el.classList.add('on'); press(k, true); });
    const up = () => { el.classList.remove('on'); press(k, false); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  });
  const releaseAll = () => { for (const k in keys) press(k, false); $$('[data-key].on').forEach(el => el.classList.remove('on')); };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  // rAF drives the game. The timer exists only for headless renders (template
  // thumbnails, scripts/game_shots.py), where rAF never fires; it ticks only
  // while the page is visible and rAF has been silent for 120 ms.
  function loop(fn){
    let last = performance.now(), seen = 0;
    const tick = () => { const t = performance.now(); const dt = Math.min((t - last) / 1000, 1 / 30); last = t; fn(Math.max(0, dt)); };
    const f = () => { seen = performance.now(); tick(); requestAnimationFrame(f); };
    requestAnimationFrame(f);
    setInterval(() => { if (!document.hidden && performance.now() - seen > 120) tick(); }, 16);
  }
  document.addEventListener('contextmenu', e => e.preventDefault());
  return { $, $$, store, setText, keys, onKey, press, releaseAll, clamp, loop };
})();

/* ==========================================================
   Sound (SFX): engine, hits, siren and a loop per route, all synthesised
   ========================================================== */
// SFX: synthesised sound. No-ops until unlock(); never throws.
const SFX = (() => {
  const T = { s: 'sine', q: 'square', w: 'sawtooth', t: 'triangle', l: 'lowpass', b: 'bandpass', h: 'highpass' };
  let ac, out, mus, noise, es, eq, ef, eg, ek = 0, ex, Z, zl = 0, muted, held, want, song, tmr, st, nt;
  const c01 = x => Math.min(1, Math.max(0, +x || 0));
  const safe = f => (...a) => { try { ac && f(...a); } catch {} };
  const C = (...n) => n.reduce((a, b) => (a.connect(b), b));
  const L = (p, v, c = .04) => p.setTargetAtTime(v, ac.currentTime, c);
  const G = gain => new GainNode(ac, { gain });
  const F = (frequency, Q, type) => new BiquadFilterNode(ac, { type, frequency, Q });
  const O = (t, type, frequency, s = type ? new OscillatorNode(ac, { type, frequency })
    : new AudioBufferSourceNode(ac, { buffer: noise, loop: 1 })) => (s.start(t, Math.random()), s);
  // voice [wave f f2 decay vol x attack delay hold]: oscillator s q w t glides
  // f→f2, low-passed at x; noise l b h sweeps its filter f→f2 at Q x
  const V = ([w, f, f2, d, v, x, a = .003, dt = 0, h = 0], t, to, k = 1) => {
    const z = w < 'm', s = O(t += dt, !z && T[w], f), g = G(0), e = t + a + h + .001;
    const n = z || x ? C(s, F(z ? f : x, z && x || 1, T[z && w])) : s, p = (z ? n : s).frequency;
    p.setValueAtTime(f, t); p.exponentialRampToValueAtTime(f2 || f, t + a + d / 3);

/* ==========================================================
   Track: a strip of segments, each with a curve, a height and its scenery
   ========================================================== */
let segs = [], N = 0, FINISH = 0, RT = ROUTES[0], route = 0, league = 0;

const segAt = z => segs[G.clamp(Math.floor(z / SEG), 0, N - 1)];

function buildTrack(ri, lg){
  const R = ROUTES[ri], rnd = rng(ri * 977 + lg * 131 + 7), len = 880 + lg * 200;

  // n segments that ease into and out of a curve while the height eases by dy
  const run = (n, c, dy) => {
    const y0 = y, e = Math.max(1, Math.min(n / 3 | 0, 24));
    for (let i = 0; i < n; i++) segs.push({ curve: c * Math.min(1, ease(i / e), ease((n - i) / e)), y: y0 + dy * ease(i / n), p: [] });
    y += dy;
  };
  run(50, 0, 0);
  while (segs.length < len){
    const k = rnd(), n = 26 + rnd() * 50 | 0, dir = rnd() < .5 ? -1 : 1;
    if (R.jump && k < .14){ const j = R.jump * (.6 + rnd() * .6); run(14, 0, j); run(12, 0, -j); }   // a crest you can fly off
    else if (k < .34) run(n, 0, (rnd() - .5) * R.hilly);
    else if (k < .5){ run(n / 2 | 0, dir * R.curvy * (2 + rnd() * 2.5), (rnd() - .5) * R.hilly); run(n / 2 | 0, -dir * R.curvy * (2 + rnd() * 2.5), 0); }

  }
  FINISH = segs.length * SEG;
  run(120, 0, 0);            // run-out past the finish line
  N = segs.length - 1;       // the last segment only lends its height to the one before
  for (let i = 8; i < N; i++){
    const s = segs[i];
    for (const [n, ch, near, spread, side] of R.props)
      for (const sd of [-1, 1]) if ((!side || side === sd) && rnd() < ch) s.p.push({ n, x: sd * (RW + near + rnd() * spread) });
    if (R.posts && i % 8 === 0) for (const sd of [-1, 1]) s.p.push({ n: R.posts, x: sd * (RW + (R.posts === 'pole' ? 4 : 1.2)) });
    if (R.night && i % 9 === 0){ s.p.push({ n: 'lamp', x: (i / 9 & 1 ? 1 : -1) * (RW + .9) }); for (let k = -2; k <= 2; k++) if (segs[i + k]) segs[i + k].lit = 1; }
    if (R.rail && i % 2 === 0) s.p.push({ n: 'rail', x: -(RW + 1) });

    const b = segs[i + 20];

}

// the rider next to r within reach (cops only ever go for you)
function foe(r, rz, rx){
  let best = null, bd = 1e9;
  for (const o of riders){
    if (o === r || o.down || o.fin || (r.cop && !o.pl) || (o.cop && !r.pl && !o.ai.chase)) continue;
    const dx = Math.abs(o.x - r.x), dz = Math.abs(o.z - r.z), d = dz + dx * 1.5;
    if (dx < rx && dz < rz && dx > .2 && d < bd){ bd = d; best = o; }
  }

}
function attack(r, k){
  if (r.atk || r.cd > 0 || r.down || r.air) return;
  const f = foe(r, 6, 3.4);
  r.atk = { k, side: f ? Math.sign(f.x - r.x) || 1 : (r.side = -(r.side || 1)), t: 0, done: 0 };

}
// the blow lands a moment after the wind-up; a kick also shoves the target sideways
function swing(r, dt){
  const a = r.atk, kick = a.k === 'kick';
  a.t += dt;

    a.done = 1;
    const [reach, dmg] = kick ? [2.3, 18] : r.wpn ? WPN[r.wpn] : [2, 13];
    let o = null, bd = 9;
    for (const q of riders){

      const dx = (q.x - r.x) * a.side, dz = Math.abs(q.z - r.z);

    }

  }
  if (a.t > (kick ? .42 : .28)){ r.atk = null; r.cd = kick ? .5 : .22; }
}
function strike(r, o, dmg, push){
  o.hp -= dmg * (1 - o.armor * .6) * (o.pl ? LEAGUES[league][3] : 1);
  o.hurt = .35; o.spd *= .97; o.vx += push * 7;
  if (r.pl) o.grudge++;
  const near = r.pl || o.pl;

  if (near){ shake = Math.max(shake, .45); burst(o.z, (o.x + r.x) / 2, 1.2, 6, '#ffe14d', 5); }
  if (o.pl){ hurtFx = .3; SFX.play('hit', .6); }

}
function knock(o, by){
  fall(o);

  P.nos = Math.min(100, P.nos + 25); slow = .45;
  banner(o.cop ? 'Cop down!' : 'Knockout!'); SFX.play('ko');
  if (o.wpn && !by.wpn){ by.wpn = o.wpn; o.wpn = null; toast(`You took the ${by.wpn}!`); }

// off the bike: the rider tumbles one way, the bike slides the other; spd > 0 means a crash into something solid
function fall(r, spd){

  r.down = r.pl ? 2.8 : r.cop ? 7 : 4 + Math.random() * 2.5;
  r.tum = { z: r.z, x: r.x, v: r.spd * .8 + 3, h: 0, vh: 4, rot: 0, bz: r.z, bx: r.x, bv: r.spd * .6, br: 0 };

  if (Math.abs(r.z - P.z) < 90) SFX.play('crash', r.pl ? 1 : .4, pan(r));

function getUp(r, dt){

// speed, steering, the bend pushing you wide, flying off crests, scenery
function ride(r, dt){

    else { r.vy = vy; r.y = ry; }

    const k = HITW[p.n];

}

function playerCtl(dt){

// rivals, cops and the demo rider: pick a line, mind the bends, pick fights
function aiCtl(r, dt){
  const ai = r.ai, lead = zOf(r) - zOf(P);

    if (!ai.chase || ai.done){ r.lim = 26; ai.tx = 1.5; }

  for (const r of riders) if (r.down) dyn.push([r.tum.bz, 1, r], [r.tum.z, 2, r]); else dyn.push([r.z, 0, r]);
  for (const c of cars) if (c.z > camZ && c.z < far) dyn.push([c.z, 3, c]);
  dyn.sort((a, b) => b[0] - a[0]);
  let k = 0;
  for (let n = cnt - 1; n >= 0; n--){
    road(n); scenery(n);
    const z0 = (base + n) * SEG;
    while (k < dyn.length && dyn[k][0] >= z0){ const d = dyn[k++]; if (d[0] < far) thing(d, n); }
  }
  for (const p of FX){
    const n = Math.floor(p.z / SEG) - base;
    if (n < 0 || n >= cnt) continue;
    const [X, Y, sc] = at(p.z, p.x, n), s = Math.max(1, sc * .08);
    ctx.fillStyle = p.c; ctx.fillRect(X - s / 2, Y - p.h * sc, s, s);
  }
  weather();
  if (P.nosOn){
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let i = 0; i < 14; i++){ const a = Math.random() * 6.3, r0 = .35 + Math.random() * .3, c = Math.cos(a), s = Math.sin(a); ctx.moveTo(CX + c * r0 * W, HY + s * r0 * H); ctx.lineTo(CX + c * (r0 + .3) * W, HY + s * (r0 + .3) * H); }
    ctx.stroke();
  }
  if (flash > 0){ ctx.fillStyle = `rgba(225,232,255,${flash * .55})`; ctx.fillRect(0, 0, W, H); }
  if (hurtFx > 0){ ctx.fillStyle = `rgba(255,30,60,${hurtFx * .5})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'playing') overlay();
}
function weather(){
  const kind = RT.wx;
  if (!kind) return;
  const dt = wdt, sp = P ? P.spd : 0;
  if (kind === 'rain'){
    ctx.strokeStyle = 'rgba(190,205,235,.45)'; ctx.lineWidth = 1; ctx.beginPath();
    for (const d of WX){ d[1] += dt * (1.4 + d[2]); if (d[1] > 1){ d[1] -= 1; d[0] = Math.random() * 6.3; } const X = d[0] / 6.3 * W, Y = d[1] * H; ctx.moveTo(X, Y); ctx.lineTo(X - 2 - P.steer * 3, Y + 6 + d[2] * 6); }
    ctx.stroke(); return;
  }
  // snow and dust stream out of the vanishing point as you ride into them
  ctx.fillStyle = kind === 'snow' ? 'rgba(255,255,255,.85)' : 'rgba(240,215,170,.6)';
  const n = kind === 'snow' ? 90 : 26;
  for (let i = 0; i < n; i++){
    const d = WX[i];
    d[1] += dt * (.12 + sp / 110) * (.3 + d[1]) * (.6 + d[2]);
    if (d[1] > 1.3){ d[1] = .02 + Math.random() * .1; d[0] = Math.random() * 6.3; }
    const s = d[1] > .7 ? 2 : 1;
    ctx.fillRect(CX + Math.cos(d[0]) * d[1] * W * .7 | 0, HY + Math.sin(d[0]) * d[1] * H * .7 | 0, s, s);
  }
}
// race strip (where everyone is) and warnings for riders closing in behind you
function overlay(){
  const x0 = BAND.x + 10, x1 = BAND.x + BAND.w - 10, y = Math.round(BAND.y + 5);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x0 - 1, y - 1, x1 - x0 + 2, 3);
  for (let i = 0; i < 4; i++){ ctx.fillStyle = i & 1 ? '#000' : '#fff'; ctx.fillRect(x1 + 2 + (i & 1) * 2, y - 2 + (i >> 1) * 2, 2, 2); }
  for (const r of riders){
    const u = x0 + (x1 - x0) * G.clamp(zOf(r) / FINISH, 0, 1);
    if (r.cop && (r.ai.done || !(T * 4 & 1))) continue;
    ctx.fillStyle = r.pl ? '#ffe14d' : r.cop ? '#36e2ff' : r.look.suit;
    r.pl ? ctx.fillRect(u - 2, y - 2, 4, 5) : ctx.fillRect(u - 1, y - 1, 2, 3);
  }
  if (P.down) return;
  for (const q of riders){
    if (q === P || q.down) continue;
    const dz = q.z - P.z;
    if (dz > -1 || dz < -22 || Math.abs(q.x - P.x) > 5) continue;
    const s = q.x < P.x ? -1 : 1, ax = CX + s * Math.min(BAND.w * .42, 9 * K), ay = PY - 1.1 * K;
    ctx.fillStyle = q.cop ? (T * 6 & 1 ? '#2060ff' : '#ff2040') : `rgba(255,45,85,${.5 + .5 * Math.sin(T * 14)})`;
    ctx.beginPath(); ctx.moveTo(ax, ay - 6); ctx.lineTo(ax + 5, ay + 3); ctx.lineTo(ax - 5, ay + 3); ctx.fill();
  }
}

/* ==========================================================
   Shell: states, HUD, garage, results
   ========================================================== */
const bars = { hp: G.$('#bHp'), nos: G.$('#bNos'), bike: G.$('#bBike'), foe: G.$('#bFoe') }, foeEl = G.$('#foe');
const bar = (el, v) => { v = Math.round(G.clamp(v, 0, 1) * 40) / 40; if (el._v !== v){ el._v = v; el.style.transform = `scaleX(${v})`; } };
let toastTimer = 0;
function banner(t, cls = ''){ const b = G.$('#banner'); b.textContent = t; b.className = 'banner ' + cls; void b.offsetWidth; b.classList.add('show'); }
function toast(t){ if (state !== 'playing' && state !== 'ready') return; const e = G.$('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove('show'), 1300); }
function setState(s){ state = s; root.dataset.gameState = s; }
function unlock(){ SFX.unlock(); SFX.setMuted(!save.snd); }
function hudUpd(){
  G.setText('pos', `${P.place}/${riders.filter(r => !r.cop).length}`); G.setText('kos', P.kos);
  G.setText('spd', Math.round(P.spd * 3.6)); G.setText('wpn', P.wpn ? P.wpn : '');
  bar(bars.hp, P.hp / P.hpMax); bar(bars.nos, P.nos / 100); bar(bars.bike, 1 - P.dmg / 100);
  const f = !P.down && foe(P, 14, 4);
  foeEl.classList.toggle('on', !!f);
  if (f){ G.setText('foeName', f.name); bar(bars.foe, f.hp / f.hpMax); }
}
function nextLine(){ G.setText('next', `Next: ${ROUTES[save.sel].name} · ${LEAGUES[save.lg][0]}` + (save.cash ? ` · ${money(save.cash)}` : '')); }
// the start screen: a demo race, already in full swing
function demo(){
  setupRace(demoRoute, 0, 1);
  const z0 = 420 + Math.random() * 200;
  // the pack bunched up around you, so the start screen opens on a brawl
  riders.forEach((r, k) => { if (r.cop) return; r.z = z0 + (k - 3) * 4 + Math.random() * 2; r.x = LANES[k & 3] * .7; r.spd = r.top * .97; });
  P.z = z0; P.x = .6; P.spd = P.top;
  for (const r of riders) r.y = roadY(r.z);
  camZ = P.z - CAMD; camX = P.x * .8;
}
function enterAttract(){ setState('attract'); SFX.stopEngine(); SFX.siren(0); SFX.music(5); nextLine(); }
function startRace(ri = save.sel, lg = save.lg){
  G.releaseAll(); unlock();
  save.sel = ri; save.lg = lg;
  setupRace(ri, lg, 0); setState('playing'); SFX.suspend(false); SFX.music(ri);
  G.$('#toast').classList.remove('show'); hudUpd();
}
function pause(){ if (state !== 'playing') return; setState('paused'); G.releaseAll(); SFX.stopEngine(); SFX.siren(0); SFX.suspend(true); }
function resume(){ if (state !== 'paused') return; setState('playing'); SFX.suspend(false); }
function results(){
  const L = LEAGUES[league], m = L[2];
  let gain, text = '', ok = 0;
  if (endKind === 'finish'){
    gain = Math.round((PRIZE[P.place - 1] + P.kos * 150 + copKos * 150) * m / 10) * 10;
    if (P.place <= 3){
      ok = 1;
      const was = qualified(league, route), nl = Math.min(2, league + 1), lgWas = leagueOpen(nl);
      if (!save.best[league][route] || P.place < save.best[league][route]) save.best[league][route] = P.place;
      text = was ? 'Qualified' : route < 4 ? `${ROUTES[route + 1].name} unlocked` : !lgWas && leagueOpen(nl) ? `${LEAGUES[nl][0]} league unlocked` : 'Qualified';
    } else text = 'Finish in the top 3 to qualify';
  } else {
    gain = -Math.min(save.cash, Math.round((endKind === 'wreck' ? 500 : 800) * m));
    text = endKind === 'wreck' ? 'Your bike is in pieces. Repairs paid' : 'Caught by the police. Fine paid';
  }
  save.cash = Math.max(0, save.cash + gain); save.kos += P.kos;
  [nextR, nextL] = ok ? (route < 4 ? [route + 1, league] : league < 2 ? [0, league + 1] : [route, league]) : [route, league];
  save.sel = nextR; save.lg = nextL; persist();
  G.setText('ovTitle', endKind === 'finish' ? `${ord(P.place)} place` : endKind === 'wreck' ? 'Wrecked' : 'Busted');
  G.setText('ovRoute', `${RT.name} · ${L[0]}`);
  G.setText('ovPlace', endKind === 'finish' ? ord(P.place) : '-'); G.setText('ovKos', P.kos);
  G.setText('ovCash', (gain < 0 ? '-' : '+') + money(Math.abs(gain)));
  G.setText('ovText', text); G.setText('ovNext', ok ? 'Next race' : 'Try again');
  setState('over'); overAt = performance.now(); nextLine();
  SFX.siren(0); if (gain > 0) SFX.play('cash');
}
const nextRace = () => startRace(nextR, nextL);
function openGarage(){
  G.releaseAll(); unlock(); SFX.stopEngine(); SFX.siren(0); SFX.suspend(false);
  if (state !== 'attract') demo();
  setState('ready'); garage(); SFX.music(5);
}
const IMG = {};
const bikeImg = i => IMG[i] || (IMG[i] = ART.shopBike(i, BIKES[i][6]).toDataURL());
function garage(){
  G.setText('gCash', money(save.cash));
  G.$('#gLeague').innerHTML = LEAGUES.map((l, i) => `<button data-lg="${i}" class="${i === save.lg ? 'on' : ''}"${leagueOpen(i) ? '' : ' disabled'}>${l[0]}</button>`).join('');
  G.$('#gRoutes').innerHTML = ROUTES.map((r, i) => {
    const open = routeOpen(save.lg, i), b = save.best[save.lg][i];
    return `<button class="rc${i === save.sel ? ' on' : ''}" data-r="${i}"${open ? '' : ' disabled'} style="background:linear-gradient(#0000 25%,#000d),linear-gradient(${r.sky.join()})">` +
      `<b>${r.name}</b><small>${!open ? 'Locked' : b ? 'Best ' + ord(b) : r.cops ? 'Police patrol' : 'Open'}</small></button>`;
  }).join('');
  G.$('#gBikes').innerHTML = BIKES.map((b, i) => `<button class="bc${i === save.bike ? ' on' : ''}" data-b="${i}"><img alt="" src="${bikeImg(i)}"><b>${b[0]}</b><span class="st">` +
    [['Speed', (b[2] - 45) / 30], ['Accel', (b[3] - 8) / 10], ['Grip', b[4]], ['Armor', b[5] * 2]].map(([k, v]) => `<small>${k}</small><i><b style="width:${Math.round(G.clamp(v, .08, 1) * 100)}%"></b></i>`).join('') +
    `</span><small>${i === save.bike ? 'Riding' : save.own[i] ? 'Owned' : money(b[1])}</small></button>`).join('');
  nextLine();
}
G.$('#garage').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.lg) { save.lg = +d.lg; save.sel = firstOpen(save.lg); }
  else if (d.r) save.sel = +d.r;
  else if (d.b){
    const i = +d.b, b = BIKES[i];
    if (save.own[i]) save.bike = i;
    else if (save.cash >= b[1]){ save.cash -= b[1]; save.own[i] = 1; save.bike = i; SFX.play('buy'); toast(`The ${b[0]} is yours`); }
    else { SFX.play('click', .3); toast(`You need ${money(b[1] - save.cash)} more`); return; }
  } else return;
  SFX.play('click', .5); persist(); garage();
});
function sound(on){
  const t = on ? 'Sound on' : 'Sound off', g = G.$('#sndG');
  save.snd = on ? 1 : 0; SFX.setMuted(!on); G.setText('sndP', t);
  g.classList.toggle('off', !on); g.setAttribute('aria-label', t);
}
G.$('#sndP').onclick = G.$('#sndG').onclick = () => { unlock(); sound(!save.snd); persist(); };
G.$('#gRace').onclick = () => startRace(save.sel, save.lg);
G.$('#gClose').onclick = enterAttract;
G.$('#garageBtn').addEventListener('click', openGarage);
G.$('#resume').onclick = resume;
G.$('#restart').onclick = () => startRace(route, league);
G.$('#quit').onclick = openGarage;
G.$('#ovNext').onclick = nextRace;
G.$('#ovGarage').onclick = openGarage;
G.$('#over').addEventListener('pointerdown', e => { if (!e.target.closest('button') && performance.now() - overAt > 1000) nextRace(); });
G.$('#paused').addEventListener('pointerdown', e => { if (!e.target.closest('.card')) resume(); });
G.$('#pauseBtn').addEventListener('click', e => { e.currentTarget.blur(); state === 'paused' ? resume() : pause(); });
cvs.addEventListener('pointerdown', e => { e.preventDefault(); unlock(); if (state === 'attract') startRace(); else if (state === 'paused') resume(); });
G.onKey((k, d) => {
  if (!d) return;
  unlock();
  if (state === 'attract') startRace();
  else if (state === 'paused') resume();
  else if (state === 'playing' && (k === 'hit' || k === 'kick') && !count && !endKind && !P.down) attack(P, k);
});
document.addEventListener('keydown', e => {
  const go = e.code === 'Space' || e.code === 'Enter';
  if (go && e.repeat && state !== 'playing'){ e.preventDefault(); return; }
  if (go && (state === 'attract' || state === 'ready')){ e.preventDefault(); startRace(); }
  else if (go && state === 'over'){ e.preventDefault(); if (performance.now() - overAt > 600) nextRace(); }
  else if (go && state === 'paused'){ e.preventDefault(); resume(); }
  else if (e.code === 'Space' && state === 'playing'){ e.preventDefault(); G.press('boost', true); }
  else if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'playing' || state === 'paused')){ e.preventDefault(); state === 'playing' ? pause() : resume(); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') G.press('boost', false); });
// leaving the app pauses a race and silences every screen; coming back wakes the menus (a paused race waits for Resume)
const away = () => state === 'playing' ? pause() : SFX.suspend(true);
const back = () => { if (state !== 'paused') SFX.suspend(false); };
document.addEventListener('visibilitychange', () => document.hidden ? away() : back());
window.addEventListener('blur', away);
window.addEventListener('focus', back);
// iOS lets audio start only from a finished gesture (a touch's pointerdown does not count)
for (const t of ['pointerup', 'touchend', 'click', 'keydown']) window.addEventListener(t, unlock, { capture: true, passive: true });

G.setText('cta', TOUCH ? 'Tap to race' : 'Click or press Space');
G.setText('how', TOUCH ? 'Steer \u25C0\uFE0E \u25B6\uFE0E · Hit and Kick the riders beside you · Nos boosts' : 'Arrows steer · J hit · K kick · Space nos · ↓ brake');
sound(save.snd);
demo(); enterAttract();
new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);
resize();
// reduced motion: one settled frame of the demo, then it holds still
if (REDUCED) for (let i = 0; i < 90; i++) step(1 / 60);
G.loop(dt => {
  wdt = 0;
  if (state === 'playing' || state === 'over' || (!REDUCED && (state === 'attract' || state === 'ready'))){ step(dt); wdt = dt; }
  draw();
  if (state === 'playing') hudUpd();
});
</script>
</body>
